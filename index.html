<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F6F5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="業界ブリーフ">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>業界ブリーフ</title>
<style>
:root{color-scheme:light only;--bg:#F6F5F2;--card:#FFFFFF;--ink:#1A1A1A;--sub:#5B5B57;--mute:#77766F;--line:#EEEDE9;--line2:#DEDCD6;--seg:#ECEAE5;--S:#C2410C;--A:#1D4ED8;--todo:#B45309;--todobg:#FFF7E6;--todoline:#F5C77E;--noimg:#F1EFE8}
html{font-size:17px;-webkit-text-size-adjust:100%;background:var(--bg)}
@supports (font: -apple-system-body){html{font:-apple-system-body}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--A);text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.head{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.ttl{font-size:1.3rem;font-weight:700}
.upd{font-size:.72rem;color:var(--sub)}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid #D6D4CE;background:#fff;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:16px;margin:10px -16px 0;padding:2px 20px 0;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:0 0 10px;font-size:.82rem;font-weight:500;color:var(--sub);white-space:nowrap}
.tab.on{border-bottom:3px solid var(--ink);padding-bottom:7px;font-weight:700;color:var(--ink)}
.n{font-weight:700;color:var(--mute)}.n.s{color:var(--S)}
.seg{display:flex;gap:4px;background:var(--seg);border-radius:10px;padding:4px;margin-top:12px}
.seg button{flex:1;height:36px;border:0;border-radius:8px;background:transparent;color:var(--sub);font-size:.78rem;font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px #D6D4CE;font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;padding:0 4px;margin-top:4px}
.crumb{font-size:.72rem;color:var(--sub)}
.tg{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:500;min-height:40px;border:0;background:transparent;padding:0}
.sw{width:44px;height:26px;border-radius:13px;background:#C9C7C0;display:flex;align-items:center;padding:3px;transition:.15s}
.sw i{width:20px;height:20px;border-radius:10px;background:var(--bg);display:block}
.tg.on .sw{background:var(--ink);justify-content:flex-end}
.list{background:var(--card);border-radius:14px;padding:2px 16px;margin-top:8px;overflow:hidden}
.row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;position:relative;touch-action:pan-y;transition:transform .15s}
.row:last-child{border-bottom:0}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row.read .rt{color:var(--sub);font-weight:500}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lv{color:#fff;font-size:.65rem;font-weight:700;border-radius:4px;padding:2px 6px}
.lv.S{background:var(--S)}.lv.A{background:var(--A)}.lv.B{background:#77766F}.lv.C{background:#A8A69F}
.mk{font-size:.65rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.mk.new{color:#fff;background:var(--ink)}.mk.cont{color:#9A3412;background:#FFF4ED}.mk.todo{color:var(--todo);background:var(--todobg);border:1px dashed var(--todoline);padding:1px 8px}
.mk.rated{color:var(--sub);background:var(--line)}
.rt{font-size:.82rem;font-weight:700;line-height:1.45}
.rs{font-size:.72rem;color:var(--sub);line-height:1.5}
.ph{width:64px;height:64px;border-radius:10px;flex:none;object-fit:cover;background:var(--noimg)}
.noimg{width:64px;height:64px;border-radius:10px;flex:none;background:var(--noimg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#8A887F;font-size:.55rem;font-weight:700;white-space:nowrap}
.rate{display:flex;gap:6px;padding:0 0 12px}
.rate button{flex:1;height:40px;border-radius:8px;border:1px solid #D6D4CE;background:#fff;font-weight:700;font-size:.8rem}
.rate button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.notice{background:#fff;border-radius:12px;padding:12px 14px;margin-top:12px;border-left:4px solid var(--todo)}
.notice b{display:block;font-size:.8rem}.notice span{font-size:.72rem;color:var(--sub)}
.notice.err{border-left-color:var(--S)}
.holi{background:#fff;border-radius:14px;padding:14px 16px;margin-top:12px}
.holi h3{margin:0;font-size:.9rem}.holi .rs{margin-top:2px}
.holi ul{margin:8px 0 0;padding:0 0 0 1.1em;font-size:.8rem}
.empty{padding:28px 0;text-align:center;color:var(--sub);font-size:.8rem}
.more{display:block;width:100%;margin-top:10px;height:44px;border-radius:10px;border:1px solid #D6D4CE;background:#fff;font-size:.8rem;color:var(--sub)}
/* 開いた画面 */
.back{display:inline-block;font-size:.85rem;padding:8px 0;font-weight:500}
.hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:var(--noimg);display:block;margin-top:6px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.meta .d{font-size:.7rem;color:var(--sub)}
.h1{font-size:1.15rem;font-weight:700;line-height:1.45;margin:8px 0 0}
.box{background:#fff;border-radius:14px;padding:14px 16px;margin-top:12px}
.box h4{margin:0 0 8px;font-size:.75rem;color:var(--sub);font-weight:700}
.q{display:grid;grid-template-columns:3.6em 1fr;gap:6px 10px;font-size:.85rem}
.q .k{font-size:.7rem;font-weight:700;color:var(--sub);padding-top:.15em}
.q .na{color:var(--mute)}
.chg{display:flex;flex-direction:column;gap:10px;font-size:.85rem}
.chg .r{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}.chg .r:last-child{border-bottom:0;padding-bottom:0}
.chg .l{font-weight:700;font-size:.72rem;color:var(--sub)}.chg .v{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chg .b{color:var(--sub);text-decoration:line-through;text-decoration-color:#C9C7C0}.chg .a{font-weight:700;color:var(--S)}.chg .ar{color:var(--mute)}
.steps{display:flex;gap:4px}
.steps div{flex:1;text-align:center;font-size:.7rem;padding:8px 2px;border-radius:8px;background:var(--seg);color:var(--sub)}
.steps .done{background:#E7E5DF;color:var(--ink)}.steps .now{background:var(--ink);color:#fff;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;border-radius:999px;padding:5px 12px;background:var(--seg);border:1px solid transparent}
button.chip.on{background:var(--todobg);border-color:var(--todoline);color:var(--todo);font-weight:700}
ol.pts{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:8px}
ol.pts li{counter-increment:p;display:flex;gap:10px;font-size:.85rem}
ol.pts li::before{content:counter(p);flex:none;width:1.4em;height:1.4em;border-radius:50%;background:var(--seg);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:.1em}
.todo-box{background:var(--todobg);border:1px dashed var(--todoline);border-radius:14px;padding:12px 14px;margin-top:12px}
.todo-box b{color:var(--todo);font-size:.82rem}.todo-box div{font-size:.78rem;margin-top:4px}
.big{display:block;width:100%;height:48px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:.85rem;margin-top:12px}
.arts a{display:flex;flex-direction:column;padding:10px 0;border-top:1px solid var(--line)}
.arts a:first-of-type{border-top:0}
.arts .t{font-size:.82rem;font-weight:500;color:var(--ink)}
.arts .s{font-size:.7rem;color:var(--sub)}
.arts a.vis .t{color:var(--sub)}
.foot{font-size:.65rem;color:var(--mute);text-align:center;margin-top:24px}
/* 検索 */
.sbox{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #D6D4CE;border-radius:12px;padding:0 12px;height:48px;flex:1}
.sbox input{border:0;outline:0;flex:1;font:inherit;font-size:.9rem;background:transparent}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.75rem;padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">読み込み中…</div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const LANES={industry:"業界",retail_ec:"小売EC",economy:"経済",it_sec:"IT"};
const TABS=[["all","すべて"],["weekly","週間10選"],["law","制度・郵便"],["industry","業界"],["retail_ec","小売EC"],["economy","経済"],["it_sec","IT"]];
const LAW_TAGS=["制度・法令","税・価格"];
const RIVALS=["青山商事","AOKI","コナカ","はるやま","SUIT SELECT","ORIHICA","FABRIC TOKYO","DIFFERENCE","麻布テーラー","KASHIYAMA"];
const RIVAL_PAT={"青山商事":/青山商事|洋服の青山/,"コナカ":/コナカ|フタタ/,"SUIT SELECT":/SUIT SELECT|スーツセレクト/i,"FABRIC TOKYO":/FABRIC TOKYO|ファブリックトウキョウ/i,"DIFFERENCE":/DIFFERENCE|ディファレンス/i};
const NA="記事に記載なし";
const WD="日月火水木金土";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// 日付は端末の時刻設定に関係なく日本時間で表示する
const jst=d=>{const x=new Date(d);return isNaN(x)?null:new Date(x.getTime()+9*3600e3)};
const md=d=>{const x=jst(d);return x?`${x.getUTCMonth()+1}/${x.getUTCDate()}`:""};
const mdw=d=>{const x=jst(d+"T12:00:00+09:00");return x?`${x.getUTCMonth()+1}/${x.getUTCDate()}（${WD[x.getUTCDay()]}）`:""};

// ---- 端末に残す状態（既読・評価・UI）
const LS={get(k,d){try{const v=localStorage.getItem("ib_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("ib_"+k,JSON.stringify(v))}catch(e){}}};
const read=new Set(LS.get("read",[]));const vis=new Set(LS.get("vis",[]));const rate=LS.get("rate",{});
const ui=Object.assign({tab:"all",lv:"S",unread:false},LS.get("ui",{}));
const saveUI=()=>LS.set("ui",ui);
const markRead=k=>{if(!read.has(k)){read.add(k);LS.set("read",[...read].slice(-3000))}};
const markVis=id=>{vis.add(id);LS.set("vis",[...vis].slice(-5000))};

let IDX=null,DAY=null,DIG=null,WEEK=null,OFFLINE=false,LOADED_AT=null;
const DAYS={};

async function getJSON(p){
  const r=await fetch(p,{cache:"no-cache"});
  if(!r.ok)throw new Error(r.status);
  if(r.headers.get("x-from-cache"))OFFLINE=true;
  return r.json();
}
async function load(){
  try{
    IDX=await getJSON("data/index.json");
    DAY=await getJSON(`data/days/${IDX.latest}.json`);DAYS[IDX.latest]=DAY;
    try{DIG=await getJSON(`data/digest/${IDX.latest}.json`)}catch(e){DIG=null}
    try{WEEK=IDX.weekly&&IDX.weekly[0]?await getJSON(`data/weekly/${IDX.weekly[0]}.json`):null}catch(e){WEEK=null}
    if(!navigator.onLine)OFFLINE=true;
    route();
  }catch(e){
    $("#app").innerHTML=`<div class="notice err"><b>読み込めませんでした</b><span>電波を確認してから、もう一度開いてください。</span></div>`;
  }
}

// ---- 一覧で使うデータ
function stories(){return (DAY&&DAY.stories)||[]}
function lanesOf(s){return s.lanes||[]}
function inTab(s,tab){
  if(tab==="all")return true;
  if(tab==="law")return (s.tags||[]).some(t=>LAW_TAGS.includes(t));
  if(s.c)return s.lane===tab;
  return lanesOf(s).includes(tab);
}
function cItems(){return ((DAY&&DAY.c_items)||[]).map((c,i)=>({c:true,key:`${DAY.date}:c${i}`,level:"C",summary:c.t,url:c.u,lane:c.lane,latest:c.date,tags:[]}))}
function pool(tab,lv){
  const base=lv==="C"?cItems():stories().filter(s=>s.level===lv);
  return base.filter(s=>inTab(s,tab));
}
function unreadCount(tab){return stories().filter(s=>(s.level==="S"||s.level==="A")&&inTab(s,tab)&&!read.has(s.key)).length}
function hasUnreadS(tab){return stories().some(s=>s.level==="S"&&inTab(s,tab)&&!read.has(s.key))}
function laneLabel(s){
  if((s.tags||[]).some(t=>LAW_TAGS.includes(t)))return "制度・郵便";
  const l=s.c?s.lane:lanesOf(s)[0];return LANES[l]||"";
}

// ---- 画面の部品
function thumb(s){
  return s.image?`<img class="ph" loading="lazy" referrerpolicy="no-referrer" src="${esc(s.image)}" alt="" onerror="this.outerHTML='<div class=&quot;noimg&quot;>NO IMAGE</div>'">`:`<div class="noimg">NO IMAGE</div>`;
}
function marks(s){
  let h="";
  if(s.first_seen&&s.first_seen!==DAY.date)h+=`<span class="mk cont">続報</span>`;
  else if(s.level==="S"||s.level==="A")h+=`<span class="mk new">新規</span>`;
  if(s.todo)h+=`<span class="mk todo">要追加調査</span>`;
  if(rate[s.key])h+=`<span class="mk rated">評価 ${rate[s.key]}</span>`;
  return h;
}
function sub(s){
  if(s.c)return `${esc(laneLabel(s))} ／ ${md(s.latest)}`;
  if(s.todo)return `${esc(laneLabel(s))} ／ 見出しのみ（本文を取得できず）`;
  const why=(s.quick&&s.quick.me&&s.quick.me!==NA)?s.quick.me:s.why;
  return `${esc(laneLabel(s))}${why?" ／ 関係："+esc(why):""}`;
}
function row(s){
  const rd=read.has(s.key)?" read":"";
  return `<div class="row${rd}" data-key="${esc(s.key)}">
    <div class="body"><div class="badges"><span class="lv ${s.level}">${s.level}</span>${s.c?"":marks(s)}</div>
    <div class="rt">${esc(s.summary)}</div><div class="rs">${sub(s)}</div></div>${s.c?"":thumb(s)}</div>`;
}
function notices(){
  let h="";
  const now=new Date(),today=new Date(now.getTime()+9*3600e3).toISOString().slice(0,10);
  const jstH=new Date(now.getTime()+9*3600e3).getUTCHours();
  if(OFFLINE)h+=`<div class="notice"><b>電波がありません</b><span>前回読み込んだ内容（${esc(DAY.generated.slice(5,16).replace("T"," ").replace("-","/"))}）を表示中。つながると自動で最新になります</span></div>`;
  else if(IDX.latest<today&&jstH>=7)h+=`<div class="notice err"><b>今朝の更新がまだです</b><span>最終更新 ${mdw(IDX.latest)} ${esc(DAY.generated.slice(11,16))}。前回の内容を表示中</span></div>`;
  const st=DAY.stats||{};
  if(st.model==="rules-only"||(st.failed_batches||0)>2)h+=`<div class="notice"><b>今日は簡易判定です</b><span>AIが混雑していたため、一部をキーワードによる判定に切り替えました。重要度の精度が下がっています</span></div>`;
  return h;
}
function holiday(){
  if(!DIG||!DIG.after_holiday||!DIG.lines||!DIG.lines.length)return "";
  return `<div class="holi"><h3>休み中のまとめ</h3><div class="rs">${esc(DIG.span)}</div>
   <ul>${DIG.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`;
}

// ---- 一覧
function renderList(){
  const tabs=TABS.map(([id,lb])=>{
    if(id==="weekly")return `<button class="tab${ui.tab===id?" on":""}" data-tab="${id}">${lb}</button>`;
    const n=unreadCount(id);
    return `<button class="tab${ui.tab===id?" on":""}" data-tab="${id}">${lb}${n?` <span class="n${hasUnreadS(id)?" s":""}">${n}</span>`:""}</button>`;
  }).join("");
  let body="";
  if(ui.tab==="weekly")body=renderWeekly();
  else{
    const segs=["S","A","B","C"].map(l=>{const n=pool(ui.tab,l).length;return `<button class="${ui.lv===l?"on":""}" data-lv="${l}">${l} <span class="n${l==="S"&&n?" s":""}">${n}</span></button>`}).join("");
    let items=pool(ui.tab,ui.lv);
    const un=items.filter(s=>!read.has(s.key)).length;
    if(ui.unread&&ui.lv!=="C")items=items.filter(s=>!read.has(s.key));
    const tabName=TABS.find(t=>t[0]===ui.tab)[1];
    body=`<div class="seg">${segs}</div>
      <div class="bar"><span class="crumb">${tabName} ／ ${ui.lv}${ui.lv==="C"?"（見出しのみ）":` ／ 未読 ${un}`}</span>
      <button class="tg${ui.unread?" on":""}" id="unr" aria-pressed="${ui.unread}">未読のみ<span class="sw"><i></i></span></button></div>
      ${items.length?`<div class="list" id="list">${items.slice(0,200).map(row).join("")}</div>`:`<div class="empty">${ui.unread?"未読はありません":"この区分の話題はありません"}</div>`}`;
  }
  $("#app").innerHTML=`<div class="head"><div><div class="ttl">業界ブリーフ</div><div class="upd">${mdw(DAY.date)} ${esc((DAY.generated||"").slice(11,16))} 更新</div></div>
    <button class="icon-btn" aria-label="検索" onclick="location.hash='#/search'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></div>
    <div class="tabs" role="tablist">${tabs}</div>${notices()}${ui.tab==="all"&&ui.lv==="S"?holiday():""}${body}
    <div class="foot">右にスワイプで重要度を付けられます</div>`;
  $("#app").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;saveUI();renderList()});
  $("#app").querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{ui.lv=b.dataset.lv;saveUI();renderList()});
  const u=$("#unr");if(u)u.onclick=()=>{ui.unread=!ui.unread;saveUI();renderList()};
  bindRows();
  const on=$(".tab.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});
}
function bindRows(){
  $("#app").querySelectorAll(".row").forEach(el=>{
    let x0=null,y0=null,dx=0;
    el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0},{passive:true});
    el.addEventListener("touchmove",e=>{if(x0===null)return;dx=e.touches[0].clientX-x0;const dy=e.touches[0].clientY-y0;if(Math.abs(dy)>Math.abs(dx)){x0=null;el.style.transform="";return}if(dx>0)el.style.transform=`translateX(${Math.min(dx,90)}px)`},{passive:true});
    el.addEventListener("touchend",()=>{el.style.transform="";if(x0!==null&&dx>70)openRate(el);x0=null});
    el.addEventListener("click",()=>{if(dx>10)return;open(el.dataset.key)});
  });
}
function openRate(el){
  const k=el.dataset.key;if(k.includes(":c")&&/:c\d+$/.test(k))return;
  const nx=el.nextElementSibling;if(nx&&nx.classList.contains("rate")){nx.remove();return}
  const d=document.createElement("div");d.className="rate";
  d.innerHTML=["S","A","B","C"].map(l=>`<button class="${rate[k]===l?"on":""}" data-r="${l}">${l}</button>`).join("");
  d.querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();setRate(k,b.dataset.r);d.remove();renderList()});
  el.after(d);
}
function setRate(k,l){if(rate[k]===l)delete rate[k];else rate[k]=l;LS.set("rate",rate);toast(rate[k]?`重要度 ${l} を記録しました（翌朝の判定に反映）`:"評価を取り消しました")}
function open(k){
  const c=cItems().find(s=>s.key===k);
  if(c){window.open(c.url,"_blank","noopener");return}
  location.hash="#/s/"+encodeURIComponent(k);
}

// ---- 週間10選
function renderWeekly(){
  if(!WEEK||!WEEK.picks||!WEEK.picks.length)return `<div class="empty">今週の10選はまだありません（週の最初の営業日に作成）</div>`;
  const rows=WEEK.picks.map((p,i)=>{
    const s=findStory(p.key);const title=s?s.summary:p.key.split(":").slice(1).join(":");
    return `<div class="row" data-key="${esc(p.key)}"><div style="width:1.6em;font-weight:700;color:var(--mute);flex:none;text-align:center">${i+1}</div>
      <div class="body"><div class="badges">${s?`<span class="lv ${s.level}">${s.level}</span><span class="rs">${esc(laneLabel(s))}</span>`:""}</div>
      <div class="rt">${esc(title)}</div>${p.reason?`<div class="rs">${esc(p.reason)}</div>`:""}</div>${s?thumb(s):""}</div>`;
  }).join("");
  setTimeout(()=>preloadWeek(),0);
  return `<div class="crumb" style="margin-top:12px;padding:0 4px">${esc(WEEK.range)} の週に「読んだ方がいい」10件</div><div class="list">${rows}</div>`;
}
function findStory(k){const d=k.split(":")[0];const doc=DAYS[d];return doc?doc.stories.find(s=>s.key===k):null}
let weekLoading=false;
async function preloadWeek(){
  if(weekLoading||!WEEK)return;const need=[...new Set(WEEK.picks.map(p=>p.date))].filter(d=>!DAYS[d]);if(!need.length)return;
  weekLoading=true;for(const d of need){try{DAYS[d]=await getJSON(`data/days/${d}.json`)}catch(e){}}weekLoading=false;if(ui.tab==="weekly"&&!location.hash.startsWith("#/s/"))renderList();
}

// ---- 開いた画面
async function renderDetail(k){
  const d=k.split(":")[0];
  if(!DAYS[d]){try{DAYS[d]=await getJSON(`data/days/${d}.json`)}catch(e){}}
  const s=DAYS[d]&&DAYS[d].stories.find(x=>x.key===k);
  if(!s){$("#app").innerHTML=`<a class="back" href="#/">‹ 一覧に戻る</a><div class="empty">この話題は見つかりませんでした</div>`;return}
  markRead(k);
  const q=s.quick||null,todo=!!s.todo;
  const qrow=(lb,v)=>`<span class="k">${lb}</span><span class="${!v||v===NA?"na":""}">${esc(v||NA)}</span>`;
  let h=`<a class="back" href="#/">‹ 一覧に戻る</a>`;
  if(s.image)h+=`<img class="hero" referrerpolicy="no-referrer" src="${esc(s.image)}" alt="" onerror="this.remove()">`;
  h+=`<div class="meta"><span class="lv ${s.level}">${s.level}</span>${marks(s)}<span class="rs">${esc(laneLabel(s))}</span>
     <span class="d">${s.first_seen&&s.first_seen!==d?`初報 ${md(s.first_seen)} ・ `:""}更新 ${md(s.latest||d)}</span></div>
     <div class="h1">${esc(s.summary)}</div>`;
  if(todo){
    h+=`<div class="todo-box"><b>追加調査が必要</b><div>本文を読めませんでした（会員記事・取得不可など）。同じ件の無料記事も見つからず、下は<b>見出しから分かることだけ</b>です。</div></div>`;
  }
  if(q){
    h+=`<div class="box"><h4>30秒で${todo||s.body!=="ok"?"（見出しから）":""}</h4><div class="q">${qrow("何が",q.what)}${qrow("いつ",q.when)}${qrow("自分に",q.me)}</div></div>`;
  }else if(s.why){
    h+=`<div class="box"><h4>関係</h4><div style="font-size:.85rem">${esc(s.why)}</div></div>`;
  }
  const dg=s.diagram||{};
  if(dg.type==="change"&&dg.rows&&dg.rows.length){
    h+=`<div class="box"><h4>${esc(dg.title||"変わる所")}</h4><div class="chg">${dg.rows.map(r=>{const vague=!r.before||/^(旧|従来|現行|変更前|改定前)?(価格|料金|運賃)?$/.test(r.before.trim());
      return `<div class="r"><span class="l">${esc(r.label)}</span><span class="v">${vague?"":`<span class="b">${esc(r.before)}</span><span class="ar" aria-hidden="true">→</span>`}<span class="a">${esc(r.after||"―")}</span></span></div>`}).join("")}</div></div>`;
  }else if(dg.type==="steps"&&dg.steps&&dg.steps.length){
    h+=`<div class="box"><h4>${esc(dg.title||"進み具合")}</h4><div class="steps">${dg.steps.map(x=>`<div class="${x.state}">${esc(x.label)}</div>`).join("")}</div></div>`;
  }else if(dg.type==="impact"&&dg.impact&&dg.impact.length){
    h+=`<div class="box"><h4>${esc(dg.title||"影響する業務")}</h4><div class="chips">${dg.impact.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>`;
  }
  if(s.points&&s.points.length){
    h+=`<div class="box"><h4>もっと詳しく：要点</h4><ol class="pts">${s.points.map(p=>`<li><span>${esc(p)}</span></li>`).join("")}</ol>${s.refill?`<div class="rs" style="margin-top:8px">本文は同じ件の別記事（${esc(s.refill.source)}）から</div>`:""}</div>`;
  }
  const qs=s.questions||[];
  if(qs.length||todo){
    h+=`<div class="box"><h4>足りない所をClaudeで調べる</h4><div class="chips" id="qs">${qs.map((x,i)=>`<button class="chip on" data-q="${i}">＋${esc(x)}</button>`).join("")}</div>
      <button class="big" id="askq">Claudeで調べる（見出し＋質問を渡す）</button></div>`;
  }
  h+=`<div class="box"><h4>この話題の重要度（翌朝の判定に反映）</h4><div class="rate" style="padding:0">${["S","A","B","C"].map(l=>`<button class="${rate[k]===l?"on":""}" data-r="${l}">${l}</button>`).join("")}</div>
     ${qs.length||todo?"":`<button class="big" id="ask">Claudeに聞く</button>`}</div>`;
  const arts=s.articles||[];const un=arts.filter(a=>!vis.has(a.id)).length;
  h+=`<div class="box arts"><h4>関連記事 ${arts.length}件${un&&arts.length>1?` ／ 未読 ${un}`:""}</h4>${arts.map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" data-id="${esc(a.id)}" class="${vis.has(a.id)?"vis":""}"><span class="t">${esc(a.title)}</span><span class="s">${esc(a.source||"")} ・ ${md(a.published)}${vis.has(a.id)?" ・ 既読":""}</span></a>`).join("")}
     ${s.refill?`<a href="${esc(s.refill.url)}" target="_blank" rel="noopener noreferrer"><span class="t">${esc(s.refill.title)}</span><span class="s">${esc(s.refill.source)} ・ 補った記事</span></a>`:""}</div>`;
  $("#app").innerHTML=h;window.scrollTo(0,0);
  $("#app").querySelectorAll(".rate [data-r]").forEach(b=>b.onclick=()=>{setRate(k,b.dataset.r);renderDetail(k)});
  $("#app").querySelectorAll("[data-id]").forEach(a=>a.addEventListener("click",()=>{markVis(a.dataset.id);setTimeout(()=>renderDetail(k),300)}));
  $("#app").querySelectorAll("#qs .chip").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
  const sel=()=>[...$("#app").querySelectorAll("#qs .chip.on")].map(b=>qs[+b.dataset.q]);
  const ask=$("#ask")||$("#askq");if(ask)ask.onclick=()=>askClaude(s,sel());
}
function askClaude(s,qs){
  const q=s.quick||{};
  const lines=["メンズスーツ専門店のEC・販促担当です。次のニュースについて、最新の情報を調べて教えてください。","",
    `話題：${s.summary}`];
  if(q.what&&q.what!==NA)lines.push(`分かっていること：${q.what}${q.when&&q.when!==NA?"（"+q.when+"）":""}`);
  (s.articles||[]).slice(0,3).forEach(a=>lines.push(`記事：${a.title}（${a.source||""}） ${a.url}`));
  lines.push("",qs&&qs.length?"知りたいこと："+qs.join("／"):"知りたいこと：自社（EC・メルマガ・DM・送料・価格表示）への影響と、やるべきこと");
  const text=lines.join("\n");
  try{navigator.clipboard&&navigator.clipboard.writeText(text)}catch(e){}
  toast("質問文をコピーしました。入力欄が空なら貼り付けてください");
  setTimeout(()=>window.open("https://claude.ai/new?q="+encodeURIComponent(text),"_blank","noopener"),400);
}

// ---- 検索（過去30日）
let SEARCH={q:"",rival:""};
async function renderSearch(){
  $("#app").innerHTML=`<div style="display:flex;gap:10px;align-items:center"><label class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" type="search" enterkeyhint="search" placeholder="キーワードで過去の記事も検索" value="${esc(SEARCH.q)}"></label><a href="#/" style="font-weight:500">閉じる</a></div>
    <div class="crumb" style="margin:14px 4px 6px">競合で絞る</div><div class="chips">${RIVALS.map(r=>`<button class="chip${SEARCH.rival===r?" on":""}" data-rv="${esc(r)}">${esc(r)}</button>`).join("")}</div>
    <div id="res"><div class="empty">読み込み中…</div></div>`;
  const inp=$("#q");let t;inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{SEARCH.q=inp.value.trim();SEARCH.rival="";doSearch();$("#app").querySelectorAll("[data-rv]").forEach(b=>b.classList.remove("on"))},250)};
  $("#app").querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{SEARCH.rival=SEARCH.rival===b.dataset.rv?"":b.dataset.rv;SEARCH.q="";inp.value="";$("#app").querySelectorAll("[data-rv]").forEach(x=>x.classList.toggle("on",x.dataset.rv===SEARCH.rival));doSearch()});
  if(!SEARCH.q&&!SEARCH.rival)inp.focus();
  const days=(IDX.days||[]).slice(0,30);
  for(const d of days){if(!DAYS[d]){try{DAYS[d]=await getJSON(`data/days/${d}.json`)}catch(e){}}}
  doSearch();
}
function doSearch(){
  const res=$("#res");if(!res)return;
  const pat=SEARCH.rival?(RIVAL_PAT[SEARCH.rival]||new RegExp(SEARCH.rival.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i")):(SEARCH.q?new RegExp(SEARCH.q.split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"i"):null);
  if(!pat){res.innerHTML=`<div class="empty">キーワードを入れるか、競合を選んでください</div>`;return}
  const out=[];
  Object.keys(DAYS).sort().reverse().forEach(d=>{const doc=DAYS[d];
    doc.stories.forEach(s=>{const txt=[s.summary,s.story,s.company,...(s.articles||[]).map(a=>a.title)].join(" ");if(pat.test(txt))out.push(s)});
    (doc.c_items||[]).forEach((c,i)=>{if(pat.test(c.t))out.push({c:true,key:`${d}:c${i}`,level:"C",summary:c.t,url:c.u,lane:c.lane,latest:c.date,tags:[]})});
  });
  const label=SEARCH.rival?`${SEARCH.rival} の記事`:`「${SEARCH.q}」`;
  res.innerHTML=`<div class="crumb" style="margin:14px 4px 0">${esc(label)} ／ 過去${Object.keys(DAYS).length}日 ${out.length}件</div>`+
    (out.length?`<div class="list">${out.slice(0,150).map(s=>`<div class="row${read.has(s.key)?" read":""}" data-key="${esc(s.key)}" data-url="${esc(s.url||"")}"><div class="body"><div class="badges"><span class="lv ${s.level}">${s.level}</span></div><div class="rt">${esc(s.summary)}</div><div class="rs">${esc(laneLabel(s))} ／ ${md(s.latest)}</div></div></div>`).join("")}</div>`:`<div class="empty">見つかりませんでした</div>`);
  res.querySelectorAll(".row").forEach(el=>el.onclick=()=>{if(el.dataset.url){window.open(el.dataset.url,"_blank","noopener")}else location.hash="#/s/"+encodeURIComponent(el.dataset.key)});
}

// ---- 画面の切り替え
let lastY=0;
function route(){
  if(!DAY)return;
  const h=location.hash||"#/";
  if(h.startsWith("#/s/"))renderDetail(decodeURIComponent(h.slice(4)));
  else if(h==="#/search")renderSearch();
  else{renderList();window.scrollTo(0,lastY)}
}
window.addEventListener("hashchange",()=>{route()});
window.addEventListener("scroll",()=>{if(!location.hash.startsWith("#/s/")&&location.hash!=="#/search")lastY=window.scrollY},{passive:true});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2400)}
// 画面を開き直した時に新しいデータがあれば読み直す
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&LOADED_AT&&Date.now()-LOADED_AT>30*60e3){LOADED_AT=Date.now();OFFLINE=false;load()}});
window.addEventListener("online",()=>{OFFLINE=false;load()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
LOADED_AT=Date.now();load();
</script>
