name: daily
# 毎朝の更新。本番は Cloudflare（industry-news-cron）が 5:17・5:47 JST に起動し、直近の評価（ratings）を一緒に渡す。
# GitHub の定時は 6:07 JST（= 21:07 UTC）だけを最後の予備として残す。
#   それより早い枠があると、評価を持たずに今日の分を先に作ってしまい、評価の反映が翌日にずれるため。
on:
  schedule:
    - cron: "7 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "作成済みでも作り直す（true/false）"
        default: "false"
      ratings:
        description: "画面で付けた評価（Cloudflare が自動で入れる。手動実行では空のまま）"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: build today
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then python scripts/daily.py --force; else python scripts/daily.py; fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROFILE: ${{ secrets.PROFILE }}
          RATINGS: ${{ inputs.ratings }}
      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "daily: $(TZ=Asia/Tokyo date +%F)" || echo "no changes"
          git pull --rebase
          git push
