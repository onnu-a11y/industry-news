name: judge-test
# 検証用：M4-6.1 の修正版を、今の基準（old_sha の judge.py）と同じ記事で比べる → data/probe/compare.md
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "何時間前までの記事を比べるか"
        default: "30"
      old_sha:
        description: "比べる元の judge.py のコミット"
        default: "origin/main"

permissions:
  contents: write

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: git show "${{ inputs.old_sha }}:scripts/judge.py" > scripts/judge_old.py
      - run: python scripts/compare.py --old scripts/judge_old.py --hours "${{ inputs.hours }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROFILE: ${{ secrets.PROFILE }}
      - name: commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "judge-test: M4-6.1 compare" || echo "no changes"
          git push
